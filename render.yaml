services:
    - type: web
      name: pixel-studio
      runtime: docker
      plan: free
      healthCheckPath: /up
      envVars:
          - key: APP_NAME
            value: Pixel Studio
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_KEY
            sync: false
          - key: APP_URL
            sync: false
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_URL
            sync: false
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: database
          - key: LOG_CHANNEL
            value: stderr
          - key: PIXELFORGE_API_KEY
            sync: false
          - key: PIXELFORGE_WEBHOOK_SECRET
            sync: false
          - key: ADMIN_EMAILS
            sync: false
          - key: BILLING_MARKUP
            value: '1.25'
          - key: BILLING_WELCOME_CREDIT
            value: '1.00'
